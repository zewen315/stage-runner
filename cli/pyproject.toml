[project]
name = "stagerunner-cli"
version = "0.1.0"
description = "Thin CLI: submits run requests to the Workflow Service and polls for status"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
