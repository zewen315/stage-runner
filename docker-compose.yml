services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stagerunner
      POSTGRES_PASSWORD: stagerunner
      POSTGRES_DB: resource_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagerunner"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stagerunner
      MINIO_ROOT_PASSWORD: stagerunner123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  resource-store:
    build: ./services/resource_store
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://stagerunner:stagerunner@postgres:5432/resource_store
      BLOB_ENDPOINT_URL: http://minio:9000
      BLOB_ACCESS_KEY: stagerunner
      BLOB_SECRET_KEY: stagerunner123
      BLOB_BUCKET: resources
      RESOURCES_ROOT: /resources
    volumes:
      - ./resources:/resources:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  workflow-service:
    build: ./services/workflow_service
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://stagerunner:stagerunner@postgres:5432/workflow_service
      WORKFLOWS_ROOT: /workflows
    volumes:
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    environment:
      DATABASE_URL: postgresql://stagerunner:stagerunner@postgres:5432/workflow_service
      REDIS_URL: redis://redis:6379
      RESOURCE_STORE_URL: http://resource-store:8000
      WORKFLOWS_ROOT: /workflows
      POLL_INTERVAL_SECONDS: "2"
    volumes:
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      resource-store:
        condition: service_started

  runner:
    build:
      context: .
      dockerfile: services/runner/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      RESOURCE_STORE_URL: http://resource-store:8000
      WORKFLOW_SERVICE_URL: http://workflow-service:8000
      WORKFLOWS_ROOT: /workflows
      OUTPUT_ROOT: /output
      # DooD: each dispatched stage's pure function call runs in its own
      # sibling container (this same image, see stage_executor.py) rather
      # than in-process. WORKFLOWS_HOST_PATH is the real host path, not
      # this container's own /workflows view -- a sibling container's
      # volume spec is resolved by the host daemon, not by us.
      STAGE_EXECUTOR_IMAGE: stage-runner-runner
      WORKFLOWS_HOST_PATH: ${PWD}/workflows
    volumes:
      - ./workflows:/workflows:ro
      - ./run_output:/output
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      resource-store:
        condition: service_started
      workflow-service:
        condition: service_started

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - resource-store
      - workflow-service

volumes:
  postgres_data:
  minio_data:
