services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stagerunner
      POSTGRES_PASSWORD: stagerunner
      POSTGRES_DB: resource_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagerunner"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stagerunner
      MINIO_ROOT_PASSWORD: stagerunner123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  resource-store:
    build: ./services/resource_store
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://stagerunner:stagerunner@postgres:5432/resource_store
      BLOB_ENDPOINT_URL: http://minio:9000
      BLOB_ACCESS_KEY: stagerunner
      BLOB_SECRET_KEY: stagerunner123
      BLOB_BUCKET: resources
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
