[project]
name = "workflow-service"
version = "0.1.0"
description = "Control plane for workflow/stage trigger requests and their status; the Scheduler owns dispatch and execution tracking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "psycopg[binary]>=3.3.4",
    "croniter>=6.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../../lib"]
markers = [
    "integration: exercises a real Postgres via testcontainers (needs Docker) -- excluded by default, run with -m integration",
]
addopts = "-m 'not integration'"
