[project]
name = "runner"
version = "0.1.0"
description = "Runner worker for Stage Runner: consumes queued runs and executes stage workloads"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "redis>=8.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../../lib"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
