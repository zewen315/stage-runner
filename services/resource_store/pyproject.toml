[project]
name = "resource-store"
version = "0.1.0"
description = "Versioned resource store: metadata + blob CRUD service for Stage Runner"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.84",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: exercises a real Postgres via testcontainers (needs Docker) -- excluded by default, run with -m integration",
]
addopts = "-m 'not integration'"
