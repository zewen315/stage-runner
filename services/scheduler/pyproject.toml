[project]
name = "scheduler"
version = "0.1.0"
description = "Scheduler for Stage Runner: drains trigger requests and dispatches stage-by-stage, dependency-aware, to the Runner worker"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "redis>=8.1.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../../lib"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
