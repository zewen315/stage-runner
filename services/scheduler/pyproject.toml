[project]
name = "scheduler"
version = "0.1.0"
description = "Scheduler for Stage Runner: drains trigger requests and dispatches stage-by-stage, dependency-aware, to the Runner worker"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "redis>=8.1.0",
    "httpx>=0.28.1",
    "croniter>=6.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../../lib"]
markers = [
    "integration: exercises a real Postgres via testcontainers (needs Docker) -- excluded by default, run with -m integration",
]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.9.0",
]
