events {}

http {
    server {
        listen 80;

        # Gateway's own liveness check, independent of any backend.
        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # The web app's own client-side routes (/resources/:name,
        # /workflows/:name/runs/:runId, ...) reuse the exact same paths as
        # the resource_store/workflow_service APIs below -- fetch() calls
        # and browser page navigation to those URLs are indistinguishable
        # by path alone. Tell them apart by Accept: a real navigation
        # (typed URL, bookmark, refresh) sends "text/html"; api.js's
        # fetch() calls don't. On an html accept, serve the SPA shell
        # instead of proxying, so react-router-dom can take over --
        # otherwise a refresh on a deep route hits the API and 404s (or
        # returns raw JSON) instead of loading the app. This is the one
        # blessed use of nginx `if` (single rewrite+last, nothing else in
        # the block) per nginx's own "if is evil" guidance.
        root /usr/share/nginx/html;

        # Resource Store: its routes are already prefixed /resources, so no
        # path rewriting -- proxy_pass with no path just forwards the
        # incoming URI unchanged. No trailing slash on the location, so it
        # matches both the bare /resources (POST to create) and nested
        # paths like /resources/{name} -- a trailing slash would only
        # match the latter.
        location /resources {
            if ($http_accept ~* "text/html") {
                rewrite ^ /index.html last;
            }
            proxy_pass http://resource-store:8000;
        }

        # Workflow Service: what the CLI/any client actually talks to for
        # running things -- it records run/schedule intent in Postgres; it
        # doesn't enqueue or execute anything itself. The Scheduler (not
        # reachable through this gateway) polls Postgres and enqueues; the
        # Runner worker (also internal) consumes the queue, executes, and
        # reports back to it.
        location /workflows {
            if ($http_accept ~* "text/html") {
                rewrite ^ /index.html last;
            }
            proxy_pass http://workflow-service:8000;
        }

        # The built React operate console -- everything else (the SPA
        # shell, its JS/CSS assets, and the root path). try_files falls
        # back to index.html for any unmatched path too, letting
        # react-router-dom handle client-side routes on refresh.
        location / {
            try_files $uri /index.html;
        }
    }
}
