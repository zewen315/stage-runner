events {}

http {
    server {
        listen 80;

        # Gateway's own liveness check, independent of any backend.
        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # Resource Store: its routes are already prefixed /resources, so no
        # path rewriting -- proxy_pass with no path just forwards the
        # incoming URI unchanged. No trailing slash on the location, so it
        # matches both the bare /resources (POST to create) and nested
        # paths like /resources/{name} -- a trailing slash would only
        # match the latter.
        location /resources {
            proxy_pass http://resource-store:8000;
        }

        # Workflow Service: what the CLI/any client actually talks to for
        # running things -- it records run/schedule intent in Postgres; it
        # doesn't enqueue or execute anything itself. The Scheduler (not
        # reachable through this gateway) polls Postgres and enqueues; the
        # Runner worker (also internal) consumes the queue, executes, and
        # reports back to it.
        location /workflows {
            proxy_pass http://workflow-service:8000;
        }
    }
}
